<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090b">
<title>Shaan's Brain</title>

<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- the wordmark is the first thing painted, so fetch its face up front -->
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css?v=57928a64">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/",
    "three-mesh-bvh": "./vendor/three-mesh-bvh.module.js"
  }
}
</script>
</head>
<body data-mode="minimal" data-sheet="none">

<div id="stage">
  <canvas id="view"></canvas>
  <div id="calloutlayer"></div>
  <div id="hovertip" hidden></div>
</div>

<div id="loader">
  <div class="ring"><i></i></div>
  <div class="bar"><i></i></div>
  <span>reconstructing</span>
</div>

<!-- Classic (non-module) script on purpose. If the browser cannot parse an
     import map, the module below never executes at all, so any diagnostics
     living inside it would never run either. This has to be able to report
     that case from the outside. -->
<script>
(function () {
  var boot = { webgl: false, importmap: false, err: null };
  try {
    boot.importmap = !!(HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'));
  } catch (e) { boot.importmap = false; }
  try {
    var c = document.createElement('canvas');
    boot.webgl = !!(c.getContext('webgl2') || c.getContext('webgl'));
  } catch (e) { boot.webgl = false; }
  window.__boot = boot;

  window.addEventListener('error', function (e) {
    if (!boot.err) boot.err = (e.message || 'load error') +
      (e.filename ? ' in ' + String(e.filename).split('/').pop() : '');
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    if (!boot.err) boot.err = 'promise: ' + ((e.reason && e.reason.message) || e.reason);
  });

  setTimeout(function () {
    if (window.__viewer) return;                 // it started fine
    var msg;
    if (!boot.webgl) {
      msg = 'This browser could not start WebGL, which the 3D view needs. ' +
            'On iOS check Settings &rsaquo; Safari &rsaquo; Advanced and make sure WebGL is on, ' +
            'or try Chrome.';
    } else if (!boot.importmap) {
      msg = 'This browser is a little too old to run the viewer. It needs iOS 16.4 or newer, ' +
            'or a recent Chrome, Firefox or Edge.';
    } else if (boot.err) {
      msg = 'Something failed while loading:<br><code>' + boot.err + '</code>';
    } else {
      msg = 'Still downloading. The model is about 9 MB, so this can take a while on a slow connection.';
    }
    var el = document.getElementById('loader');
    if (el) el.innerHTML = '<div class="failmsg">' + msg + '</div>';
  }, 25000);
})();
</script>

<header id="titlebar">
  <h1>SHAAN'S BRAIN</h1>
  <p id="subtitle">tap anything to learn about it</p>
</header>

<a id="docsBtn" href="docs/" title="How this was made">Docs</a>

<!-- ---------------------------------------------------------- left: layers -->
<aside id="layers" class="panel">
  <div class="sheet-grip"></div>
  <div class="panel-scroll">
    <h2>Views</h2>
    <div class="presets" id="presets">
      <button data-preset="surface">Whole brain</button>
      <button data-preset="lobes">Lobes</button>
      <button data-preset="deep">Deep</button>
      <button data-preset="vessels">Vessels</button>
      <button data-preset="all">Everything</button>
      <button data-preset="none">Clear</button>
    </div>

    <div id="layerlist"></div>
    <div id="loadhint"></div>

    <h2>Opacity</h2>
    <div class="row"><span class="mini">brain</span><input type="range" id="opbrain" min="4" max="100" value="100"></div>
    <div class="row"><span class="mini">head</span><input type="range" id="ophead" min="4" max="100" value="28"></div>

    <h2>Cross-section</h2>
    <div class="row">
      <div class="seg" id="clipaxis">
        <button data-axis="off" class="on">off</button>
        <button data-axis="x">sag</button>
        <button data-axis="y">ax</button>
        <button data-axis="z">cor</button>
      </div>
    </div>
    <div class="row">
      <input type="range" id="clippos" min="-100" max="100" value="0" step="0.5" disabled>
      <label class="chk" title="flip which side is cut away"><input type="checkbox" id="clipflip"></label>
    </div>

    <h2>Topics</h2>
    <button id="hemi" class="topic">
      <span>Left &amp; right brain</span><i>→</i>
    </button>
  </div>
</aside>

<!-- ---------------------------------------------------------- right: detail -->
<aside id="detail" class="panel">
  <div class="sheet-grip"></div>
  <div class="panel-scroll" id="detailbody">
    <div class="detail-empty">
      <div class="pulse"></div>
      <p>Select a structure to see what it is, what it does and how big it is.</p>
    </div>
  </div>
</aside>

<!-- ------------------------------------------------------------- bottom bar -->
<footer id="tools">
  <div class="seg" id="views">
    <button data-view="L" title="left">L</button>
    <button data-view="R" title="right">R</button>
    <button data-view="A" title="front">A</button>
    <button data-view="P" title="back">P</button>
    <button data-view="S" title="top">S</button>
    <button data-view="I" title="bottom">I</button>
  </div>
  <button id="modeBtn" class="btn">Explore</button>
  <button id="resetBtn" class="btn ghost" title="reset view">
    <span class="lbl">Reset</span><span class="ico">↺</span>
  </button>
</footer>

<div id="orient"></div>

<script type="module" src="js/app.js?v=428b0f19"></script>
</body>
</html>
